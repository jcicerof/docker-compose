services:
  samba:
    image: alpine:latest
    container_name: samba
    restart: unless-stopped
    command: ["/start.sh"]
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139/tcp"
      - "445:445/tcp"
    volumes:
      - ./config/smb.conf:/etc/samba/smb.conf
    #  - /mnt/storage:/share
      - /mnt/share/library:/share
      - ./scripts/start.sh:/start.sh
    environment:
      - TZ=America/Sao_Paulo
