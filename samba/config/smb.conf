[global]
   workgroup = WORKGROUP
   server string = Pure Samba Alpine
   security = user
   map to guest = Bad User
   unix charset = UTF-8

[public]
   path = /share/public
   browseable = yes
   writable = yes
   guest ok = yes
   create mask = 0666
   directory mask = 0777

[private]
   path = /share/private
   browseable = yes
   writable = yes
   guest ok = no
   valid users = homelab
