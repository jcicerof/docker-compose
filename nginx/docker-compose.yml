services:
  nginx:
    image: nginx:latest
    container_name: nginx-library
    volumes:
      - /mnt/share/library:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80"
    networks:
      - proxy
      #- nginx_network
      #    command: /bin/bash -c "echo 'autoindex on;' >> /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

#    labels:
#       - "traefik.enable=true"
#       - "traefik.http.routers.nginx-library.rule=Host(`library.local`)"
#       - "traefik.http.services.nginx-library.loadbalancer.server.port=8081"
#       - "traefik.http.routers.nginx-library.entrypoints=web"  # Rota para o entrypoint 'web', que esta na porta 80

networks:
  proxy:
    driver: bridge

